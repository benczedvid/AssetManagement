<main class="min-h-screen bg-slate-100">
  <section class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8">
    <form class="space-y-6" [formGroup]="form" (ngSubmit)="save()">
      @if (saveError()) {
      <div role="alert"
           class="rounded-xl border border-red-200 bg-red-50 px-5 py-4 text-sm font-medium text-red-800">
        {{ saveError() }}
      </div>
      }
      <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <div class="border-b border-slate-200 pb-5">
          <h2 class="text-xl font-bold text-[#002B51]">
            Beszállító adatai
          </h2>
        </div>

        <div class="mt-6 grid gap-5 md:grid-cols-2">

          <!-- Partner neve -->
          <label class="block">
            <span class="text-sm font-semibold text-slate-500">
              Beszállító neve
            </span>

            <input type="text"
                   formControlName="name"
                   class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-[#006AB2] focus:ring-4 focus:ring-[#006AB2]/15" />

            @if(form.controls.name.touched &&
            form.controls.name.invalid) {
            <span class="mt-1 block text-xs text-red-700">
              A beszállító neve kötelező.
            </span>
            }
          </label>

          <!-- Országkód -->
          <label class="block">
            <span class="text-sm font-semibold text-slate-500">
              Ország
            </span>

            <select formControlName="countryCode"
                    class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-[#006AB2] focus:ring-4 focus:ring-[#006AB2]/15">

              @for (item of countryCodes; track item) {
              <option [value]="item">
                {{ countryCodeLabels[item] }}
              </option>
              }

            </select>
          </label>

          <!-- Irányítószám -->
          <label class="block">
            <span class="text-sm font-semibold text-slate-500">
              Irányítószám
            </span>

            <input type="text"
                   formControlName="postalCode"
                   class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-[#006AB2] focus:ring-4 focus:ring-[#006AB2]/15" />

            @if(form.controls.postalCode.touched &&
            form.controls.postalCode.invalid) {
            <span class="mt-1 block text-xs text-red-700">
              Az irányítószám kötelező.
            </span>
            }
          </label>

          <!-- Város -->
          <label class="block">
            <span class="text-sm font-semibold text-slate-500">
              Város
            </span>

            <input type="text"
                   formControlName="city"
                   class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-[#006AB2] focus:ring-4 focus:ring-[#006AB2]/15" />

            @if(form.controls.city.touched &&
            form.controls.city.invalid) {
            <span class="mt-1 block text-xs text-red-700">
              A város megadása kötelező.
            </span>
            }
          </label>

          <!-- Utca -->
          <label class="block">
            <span class="text-sm font-semibold text-slate-500">
              Utca
            </span>

            <input type="text"
                   formControlName="street"
                   class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-[#006AB2] focus:ring-4 focus:ring-[#006AB2]/15" />

            @if(form.controls.street.touched &&
            form.controls.street.invalid) {
            <span class="mt-1 block text-xs text-red-700">
              Az utca megadása kötelező.
            </span>
            }
          </label>

          <!-- Közterület típusa -->
          <label class="block">
            <span class="text-sm font-semibold text-slate-500">
              Közterület típusa
            </span>

            <select formControlName="publicSpace"
                    class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-[#006AB2] focus:ring-4 focus:ring-[#006AB2]/15">

              @for (item of publicSpaces; track item) {
              <option [value]="item">
                {{ publicSpaceLabels[item] }}
              </option>
              }
              

            </select>

            @if(form.controls.publicSpace.touched &&
            form.controls.publicSpace.invalid) {
            <span class="mt-1 block text-xs text-red-700">
              A közterület típusa kötelező.
            </span>
            }
          </label>

          <!-- Házszám -->
          <label class="block">
            <span class="text-sm font-semibold text-slate-500">
              Házszám
            </span>

            <input type="text"
                   formControlName="houseNumber"
                   class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-[#006AB2] focus:ring-4 focus:ring-[#006AB2]/15" />

            @if(form.controls.houseNumber.touched &&
            form.controls.houseNumber.invalid) {
            <span class="mt-1 block text-xs text-red-700">
              A házszám megadása kötelező.
            </span>
            }
          </label>
                    <!-- Weboldal -->
          <label class="block">
            <span class="text-sm font-semibold text-slate-500">
              Weboldal
            </span>

            <input type="text"
                   formControlName="webpage"
                   class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-[#006AB2] focus:ring-4 focus:ring-[#006AB2]/15" />

            @if(form.controls.webpage.touched &&
            form.controls.webpage.invalid) {
            <span class="mt-1 block text-xs text-red-700">
              A weboldal megadása kötelező.
            </span>
            }
          </label>

        </div>
      </div>

      <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">

        <a routerLink="/vendors"
           class="inline-flex items-center justify-center rounded-lg border border-slate-300 px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">
          Mégse
        </a>

        <button type="submit"
                [disabled]="isSaving()"
                class="inline-flex items-center justify-center gap-2 rounded-lg bg-[#FFED00] px-5 py-3 text-sm font-bold text-[#002B51] hover:bg-[#f5e300] disabled:cursor-not-allowed disabled:opacity-60">

          @if (isSaving()) {
          <span>Mentés...</span>
          } @else {
          <span>Beszállító mentése</span>
          }

        </button>

      </div>

    </form>
  </section>
</main>
