<div class="min-h-[calc(100vh-4rem)] bg-slate-100">

  <div
    class="mx-auto grid w-full max-w-[1920px] grid-cols-1 lg:grid-cols-[17rem_minmax(0,1fr)]">

    <!-- Sidebar -->
    <aside class="border-b border-slate-200 bg-white
             lg:min-h-[calc(100vh-4rem)]
             lg:border-b-0 lg:border-r"
      aria-label="Beállítások navigáció">

      <div class="p-4 sm:p-5">

        <!-- Module header -->
        <div class="mb-4 hidden lg:block">

          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-500">
            Modul
          </p>

          <h2 class="mt-1 text-lg font-bold text-[#002B51]">
            Beállítások
          </h2>

          <p class="mt-1 text-sm leading-5 text-slate-600">
            Alkalmazásbeállítások és külső integrációk kezelése.
          </p>

        </div>

        <!-- Navigation -->
        <nav class="flex gap-2 overflow-x-auto pb-1 lg:flex-col lg:overflow-visible lg:pb-0"
          aria-label="Beállítások menüpontjai">

          <!-- Overview -->
          <a routerLink="/settings"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLinkActive="bg-[#006AB2] text-white shadow-sm"
            #overviewLink="routerLinkActive"
            [attr.aria-current]="overviewLink.isActive ? 'page' : null"
            class="group flex min-h-11 shrink-0 items-center gap-3
                   rounded-lg px-3.5 py-2.5
                   text-sm font-semibold text-[#002B51]
                   transition-colors
                   hover:bg-blue-50
                   focus-visible:outline-none
                   focus-visible:ring-2
                   focus-visible:ring-[#006AB2]
                   focus-visible:ring-offset-2
                   lg:w-full">

            <span class="material-symbols-outlined shrink-0 text-[22px]" aria-hidden="true">
              dashboard
            </span>

            <span>Áttekintés</span>

          </a>

          <!-- ServiceDesk Plus -->
          <a routerLink="/settings/service-desk"
            routerLinkActive="bg-[#006AB2] text-white shadow-sm"
            #serviceDeskLink="routerLinkActive"
            [attr.aria-current]="serviceDeskLink.isActive ? 'page' : null"
            class="group flex min-h-11 shrink-0 items-center gap-3
                   rounded-lg px-3.5 py-2.5
                   text-sm font-semibold text-[#002B51]
                   transition-colors
                   hover:bg-blue-50
                   focus-visible:outline-none
                   focus-visible:ring-2
                   focus-visible:ring-[#006AB2]
                   focus-visible:ring-offset-2
                   lg:w-full">

            <span class="material-symbols-outlined shrink-0 text-[22px]" aria-hidden="true">
              sync_alt
            </span>

            <span>ServiceDesk Plus</span>

          </a>

        </nav>

      </div>

    </aside>

    <!-- Content -->
    <main class="min-w-0">
      <router-outlet />
    </main>

  </div>

</div>
